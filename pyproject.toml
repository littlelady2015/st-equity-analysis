[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "st-equity-analysis"
version = "0.1.0"
description = "A Qlib research and Backtrader backtesting starter project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "backtrader>=1.9.78.123",
    "matplotlib>=3.7",
    "pandas>=1.5",
    "pyqlib>=0.9.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
st-equity = "st_equity_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]